[package]
name = "pysrt-rs"
version = "0.1.0"
edition = "2021"
authors = ["Anirudh <Anirudh-12@users.noreply.github.com>"]
description = "A high-performance, memory-safe Rust port of byroot/pysrt (SubRip .srt subtitle parser/editor)"
repository = "https://github.com/Anirudh-12/pysrt-rs"
license = "GPL-3.0"

[lib]
name = "libsrt"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "srt"
path = "src/bin/srt.rs"

[dependencies]
thiserror = "1.0"
encoding_rs = "0.8"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
